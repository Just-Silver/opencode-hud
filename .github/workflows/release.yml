name: Release

# 手动打 tag 触发（GitHub 官方标准发布流程）：
#   改 update/version.ts 的 VERSION → commit → git tag v1.1.0 → git push origin v1.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 生成 CHANGELOG 提交 + gh release 都需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff 需要完整历史（按 tag 分组）

      - name: 校验 tag 与 VERSION 一致
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IN_CODE="$(grep -oP 'VERSION = "\K[0-9]+\.[0-9]+\.[0-9]+' .opencode/plugins/opencode-hud/update/version.ts)"
          echo "tag=$TAG"
          echo "code=$IN_CODE"
          if [ "$TAG" != "$IN_CODE" ]; then
            echo "::error::tag ($TAG) 与 update/version.ts VERSION ($IN_CODE) 不一致"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: 生成 CHANGELOG.md（git-cliff 全量）
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md # 全量输出到 CHANGELOG.md

      # 必须放在「提交 CHANGELOG 回仓库」之前：git-cliff --current 要求 HEAD 带 tag，
      # 而提交 CHANGELOG 会新建一个未打 tag 的提交，导致 --current 报 No tag exists for the current commit
      - name: 生成当前版本 Release 说明（--current）
        id: current
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: /tmp/RELEASE_BODY.md # 仅当前版本变更

      - name: 提交 CHANGELOG 回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # 有变更才提交（首次生成 / 每次发布更新）
          git diff --cached --quiet || git commit -m "chore: 更新 CHANGELOG 到 v${{ steps.version.outputs.version }}"
          # tag 触发时 checkout 处于 detached HEAD，必须显式指定目标分支
          git push origin HEAD:main

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          body_path: /tmp/RELEASE_BODY.md # 仅当前版本变更
          draft: false
          prerelease: false
