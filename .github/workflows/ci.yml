name: CI

# 三条入口共用同一套门禁：main 推送、PR、release.yml 的 verify（workflow_call）。
# skip 的用例不算覆盖：脚本组必须显式断言 TAP 的 `# skipped 0`。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # key.test.ts 的 bun:sqlite 凭据用例只在 bun 可用时执行；测试仍用 node --test 跑。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: 打印运行时版本
        shell: bash
        run: |
          set -euo pipefail
          node --version
          bun --version

      - name: 打印本平台归档工具探测结果（仅 Windows，不参与断言）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash --version | head -n 1
          pwsh --version
          tar --version | head -n 1
          command -v tar

      - name: 安装/卸载脚本测试（skipped 必须为 0）
        shell: bash
        run: |
          set -euo pipefail
          if ! node --test --test-reporter=tap tests/install.test.ts tests/uninstall.test.ts > tap-install.txt 2>&1; then
            cat tap-install.txt
            echo "::error::install/uninstall 测试失败"
            exit 1
          fi
          node -e 'const fs=require("fs");const t=fs.readFileSync(process.argv[1],"utf8");if(!/^# skipped 0$/m.test(t)){console.error(t);process.exit(1)}' tap-install.txt

      - name: 凭据解析测试（skipped 必须为 0，依赖已安装的 bun）
        shell: bash
        run: |
          set -euo pipefail
          if ! node --test --test-reporter=tap tests/key.test.ts > tap-key.txt 2>&1; then
            cat tap-key.txt
            echo "::error::key 测试失败"
            exit 1
          fi
          node -e 'const fs=require("fs");const t=fs.readFileSync(process.argv[1],"utf8");if(!/^# skipped 0$/m.test(t)){console.error(t);process.exit(1)}' tap-key.txt

      # 只在 ubuntu 断言 0 skip：Windows 的 PATH 上常是 bsdtar，缺少 GNU tar 时该组按设计 skip。
      - name: 资产构建测试（仅 ubuntu，skipped 必须为 0）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! node --test --test-reporter=tap tests/release-asset.test.ts > tap-release-asset.txt 2>&1; then
            cat tap-release-asset.txt
            echo "::error::release-asset 测试失败"
            exit 1
          fi
          node -e 'const fs=require("fs");const t=fs.readFileSync(process.argv[1],"utf8");if(!/^# skipped 0$/m.test(t)){console.error(t);process.exit(1)}' tap-release-asset.txt

      - name: 全量测试
        shell: bash
        run: node --test tests/*.test.ts

      - name: Bash 语法检查
        shell: bash
        run: bash -n install.sh uninstall.sh

      - name: PowerShell 语法检查
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('install.ps1', 'uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              foreach ($errorItem in $errors) {
                Write-Host "::error file=$file::$($errorItem.Message)"
              }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  bundle:
    name: bundle (esbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: esbuild 编译检查（固定 0.28.2）
        run: >-
          npx --yes esbuild@0.28.2
          .opencode/plugins/opencode-hud/tui.tsx
          --bundle --platform=node --format=esm
          --jsx=automatic --jsx-import-source=@opentui/solid
          --external:@opencode/plugin/tui --external:@opentui/solid --external:solid-js
          --outfile="$RUNNER_TEMP/tui-bundle-check.js"

  bun:
    name: bundle (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: 打印 bun 版本
        run: bun --version

      - name: bun 打包冒烟
        run: >-
          bun build .opencode/plugins/opencode-hud/tui.tsx
          --target=node --format=esm
          --external @opencode/plugin/tui --external @opentui/solid --external solid-js
          --outfile "$RUNNER_TEMP/bun-build-check.js"

  changelog-render:
    name: changelog render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 全量渲染需要所有 tag

      # 全量渲染（不是 --unreleased）：main 没有新提交时 unreleased 段为空，会把模板问题误报成失败。
      - name: 用 git-cliff 全量渲染模板（不发布、不写仓库）
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: ${{ runner.temp }}/changelog-check.md

      - name: 断言渲染结果非空且含版本标题
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/changelog-check.md"
          if [ ! -s "$FILE" ]; then
            echo "::error::git-cliff 渲染结果为空"
            exit 1
          fi
          if ! grep -q '^## ' "$FILE"; then
            echo "::error::渲染结果缺少 '## ' 版本标题"
            exit 1
          fi
